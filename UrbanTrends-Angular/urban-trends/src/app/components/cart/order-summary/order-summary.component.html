<div class="bg-white rounded-xl shadow-sm p-6 h-fit">

  <h3 class="text-xl font-semibold border-b pb-3 mb-4">
    Order Summary
  </h3>

  <div class="space-y-3">
    <div class="flex justify-between">
      <span>Total Items</span>
      <span class="font-medium">{{ totalItems }}</span>
    </div>

    <div class="flex justify-between">
      <span>Grand Total</span>
      <span class="font-medium">₹{{ totalAmount }}</span>
    </div>
  </div>

  <button
    class="w-full mt-6 bg-gray-800 text-white px-6 py-3 rounded-md hover:bg-gray-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
    [disabled]="isPlacingOrder || cartLength === 0"
    (click)="placeOrder.emit()"
  >
    {{ isPlacingOrder ? 'Placing Order...' : 'Place Order' }}
  </button>
</div>
