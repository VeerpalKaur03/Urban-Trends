<div class="bg-white rounded-xl shadow-sm p-6">
  <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b border-gray-200 pb-3">
    🛒 Your Shopping Cart
  </h2>

  <div *ngIf="cartItems.length; else emptyCart" class="space-y-5">
    <div
      *ngFor="let item of cartItems"
      class="flex items-center justify-between border-b border-gray-100 pb-5 last:border-none hover:bg-gray-50 rounded-md transition-all"
    >
      <div class="flex items-center space-x-5">
        <img
          [src]="item.product?.image_url"
          alt="{{ item.name }}"
          class="w-20 h-20 object-cover rounded-md"
        />


        <div>
          <h3 class="text-lg font-semibold">{{ item.product.name }}</h3>
          <p class="text-gray-500 text-sm">Qty: {{ item.quantity }}</p>
          <p class="text-gray-800 font-semibold">₹{{ item.product.price }}</p>
        </div>
      </div>

      <button
        class="text-sm hover:text-red-600 cursor-pointer"
        (click)="remove.emit(item.id)"
      >
        Remove
      </button>
    </div>
  </div>

  <ng-template #emptyCart>
    <div class="text-center py-20">
      <p class="text-gray-600 mb-4">Your cart is empty</p>
      <button routerLink="/" class="bg-gray-800 text-white px-6 py-2 rounded-md hover:cursor-pointer">
        Shop Now
      </button>
    </div>
  </ng-template>
</div>
