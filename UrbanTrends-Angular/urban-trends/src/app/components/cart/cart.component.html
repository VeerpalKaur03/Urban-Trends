<section class="bg-gray-100 min-h-screen py-10 px-6">
  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">

   <div class="lg:col-span-2 bg-white rounded-xl shadow-sm p-6">
      <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b border-gray-200 pb-3">
        🛒 Your Shopping Cart
      </h2>

      <div *ngIf="cartItems?.length; else emptyCart" class="space-y-5">
        <div
          *ngFor="let item of cartItems"
          class="flex items-center justify-between border-b border-gray-100 pb-5 last:border-none hover:bg-gray-50 rounded-md transition-all"
        >


        <div class="flex items-center space-x-5">
            <img
              [src]="item.product?.imageUrl"
              alt="{{ item.product?.name }}"
              class="w-24 h-24 object-cover rounded-lg"
            />
            <div>
              <h3 class="text-lg font-semibold text-gray-800">{{ item.product?.name }}</h3>
              <p class="text-gray-500 text-sm mt-1">Qty: {{ item.quantity }}</p>
              <p class="text-gray-800 font-semibold mt-1">₹{{ item.product?.price }}</p>
            </div>
          </div>



          <button
            class="text-sm font-medium text-gray-600 hover:text-red-600 transition-all"
            (click)="removeFromCart(item.id!)"
          >
            Remove
          </button>
        </div>
      </div>



     <ng-template #emptyCart>
  <div class="flex flex-col items-center justify-center py-20 text-center">
    <img src="assets/posters/empty.jpg" alt="Empty Cart" class="w-52 mb-6 opacity-90" />
    <p class="text-gray-600 text-lg mb-4">Your cart is empty right now</p>
    <button
      routerLink="/"
      class="bg-gray-800 text-white px-6 py-2.5 rounded-md font-medium hover:bg-gray-700 transition-all"
    >
      Shop Now
    </button>
  </div>
</ng-template>

    </div>



    <div class="bg-white rounded-xl shadow-sm p-6 h-fit">
      <h3 class="text-xl font-semibold text-gray-800 border-b border-gray-200 pb-3 mb-4">
        Order Summary
      </h3>

      <div class="space-y-3 text-gray-700">
        <div class="flex justify-between">
          <span>Total Items</span>
<span class="font-medium">{{ totalItems }}</span>

        </div>

        <div class="flex justify-between">
          <span>Grand Total</span>
          <span class="font-medium">₹{{ totalAmount }}</span>
        </div>
      </div>

      <button
  (click)="placeOrder()"
  [disabled]="isPlacingOrder || !cartItems.length"
  class="w-full mt-6 bg-gray-800 text-white px-6 py-3 rounded-md font-medium hover:bg-gray-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
>
  {{ isPlacingOrder ? 'Placing Order...' : 'Place Order' }}
</button>

    </div>

  </div>
</section>
