<section class="bg-gray-100 min-h-screen py-10 px-6">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-sm">
    <h2 class="text-2xl font-bold mb-6 border-b pb-3">🧾 Your Orders</h2>

    <div *ngIf="orders?.length; else noOrders" class="space-y-4">
      <div *ngFor="let order of orders" class="border p-4 rounded-md bg-gray-50">
        <div class="flex justify-between items-center">
          <span>Order ID: {{ order.id }}</span>
          <span>Status: {{ order.status }}</span>
        </div>
        <div class="flex justify-between mt-2">
          <p><strong>Total Amount:</strong> ₹{{ calculateTotal(order) }}</p>
        </div>
        <div class="mt-3 text-right">
          <button
            *ngIf="order.status !== 'Cancelled'"
            (click)="cancelOrder(order.id!)"
            class="bg-red-600 text-white px-4 py-1 rounded hover:bg-red-700 transition-all cursor-pointer"
          >
            Cancel Order
          </button>
          <span *ngIf="order.status === 'Cancelled'" class="text-red-600 font-semibold"
            >Cancelled</span
          >
        </div>
      </div>
    </div>

    <ng-template #noOrders>
      <p class="text-gray-600 text-center py-10">You have no orders yet.</p>
    </ng-template>
  </div>
</section>
